name: Bug Report
description: Report a reproducible bug or cross-platform issue in Pilot
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** paste API keys, access tokens, personal data, or exploitable security details here. For security vulnerabilities, see [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clear, concise description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Start Pilot with ...
        2. Run prompt / click ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (glibc)
        - Windows 10/11
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Web UI (browser)
        - Electron Desktop
        - Android Client
        - Server / API / Evaluation Harness
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit SHA / Version
      placeholder: e.g. 9b862d35
  - type: textarea
    id: logs
    attributes:
      label: Redacted Diagnostic Output / Logs
      description: Use Settings → Diagnostics → Export Sanitized Bundle (`sanitized=true`) before pasting logs.
      render: text
