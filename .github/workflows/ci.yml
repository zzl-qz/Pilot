name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 三个平台都跑完整测试：路径大小写、符号链接、换行、进程清理的差异只会在跨平台时暴露
      - name: Maven verify
        shell: bash
        run: ./mvnw -B -ntp verify

      - name: Web unit tests
        if: runner.os != 'Windows'
        working-directory: pilot-web
        run: npm test

      - name: Web unit tests (Windows)
        if: runner.os == 'Windows'
        working-directory: pilot-web
        run: npm test

      - name: Evaluation metrics tests
        run: node --test evaluation/harness/metrics.test.mjs

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}
          path: |
            pilot-core/target/surefire-reports/**
            pilot-server/target/surefire-reports/**
          if-no-files-found: ignore
