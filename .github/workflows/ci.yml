name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Source bootstrap boundary tests
        run: node --test scripts/bootstrap.test.mjs scripts/frontend-deps.test.mjs

      - name: Install desktop dependencies
        working-directory: pilot-desktop
        run: npm ci

      # 三个平台都跑完整测试：路径大小写、符号链接、换行、进程清理的差异只会在跨平台时暴露
      - name: Maven verify
        shell: bash
        run: sh mvnw -B -ntp verify

      - name: Automatic model capabilities through isolated gateway
        run: node scripts/verify-model-capabilities.mjs

      - name: Web and TypeScript regressions
        working-directory: pilot-web/frontend
        run: node scripts/verify-migration.mjs --unit-only

      - name: Desktop unit tests
        working-directory: pilot-desktop
        run: npm test

      - name: Evaluation metrics tests
        run: node --test evaluation/harness/*.test.mjs

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}
          path: |
            pilot-core/target/surefire-reports/**
            pilot-server/target/surefire-reports/**
            pilot-core/target/checkstyle-result.xml
            pilot-server/target/checkstyle-result.xml
          if-no-files-found: ignore

  isolated-builds:
    name: isolated builds and recovery UI (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare explicit test images
        run: |
          docker pull alpine:3.20
          docker pull node:22-alpine
          docker pull maven:3.9-eclipse-temurin-25
      - name: Install UI and desktop test dependencies
        run: |
          npm --prefix pilot-web/frontend ci
          npm --prefix pilot-desktop ci
      - name: Portable reliability suite (no model API)
        run: node scripts/verify-reliability.mjs --containers --ui --web-only
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-build-reports
          path: |
            pilot-core/target/surefire-reports/**
            pilot-server/target/surefire-reports/**
            pilot-core/target/checkstyle-result.xml
            pilot-server/target/checkstyle-result.xml
          if-no-files-found: ignore

  mobile:
    name: mobile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build desktop connection bridge before configuring Android
        run: node scripts/mobile.mjs build-bridge
      - uses: android-actions/setup-android@v3
      - name: Native transport, bridge, and Android compatibility checks
        run: node scripts/mobile.mjs test
      - name: Build Android preview and bundled bridge
        run: node scripts/mobile.mjs build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-${{ matrix.os }}
          path: |
            pilot-mobile/bridge/build/reports/**
            pilot-mobile/transport/build/reports/**
            pilot-mobile/app/build/reports/**
            pilot-mobile/app/build/outputs/apk/debug/*.apk

  mobile-instrumentation:
    name: Android UI (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: android-actions/setup-android@v3
      - name: Enable KVM for the dedicated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build isolated QA APK, test APK, and connection bridge
        run: node scripts/mobile.mjs qa
      - name: Pairing, receipts, attachments, recovery, scanner and permissions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: pilot-ci-${{ matrix.api }}
          emulator-port: 5580
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back emulated
          script: node pilot-mobile/scripts/instrumentation-ci.mjs emulator-5580 --network-switch
      - name: Preserve instrumentation results and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-api-${{ matrix.api }}
          retention-days: 14
          path: |
            pilot-mobile/build/instrumentation-ci/**
            pilot-mobile/build/mobile-qa/**
            pilot-mobile/build/scanner-qa/**
            pilot-mobile/app/build/reports/**

  desktop-host:
    name: desktop host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and test native connection components without Android SDK
        run: node scripts/mobile.mjs test-bridge
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Install desktop and UI test dependencies
        run: |
          npm --prefix pilot-desktop ci
          npm --prefix pilot-web/frontend ci
      - name: Build isolated backend fixture
        shell: bash
        run: sh mvnw -B -ntp -pl pilot-server -am -DskipTests package
      - name: Verify local request boundary in a real browser
        run: node pilot-web/frontend/scripts/local-security-package-smoke.mjs
      - name: Prepare Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1 libasound2t64
          sudo chown root:root pilot-desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 pilot-desktop/node_modules/electron/dist/chrome-sandbox
      - name: Verify actual Linux GUI process, native libraries and recovery
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/verify-desktop-host.mjs
      - name: Verify actual Windows or macOS GUI process, native libraries and recovery
        if: runner.os != 'Linux'
        run: node scripts/verify-desktop-host.mjs
      - name: Preserve host verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-host-${{ matrix.os }}
          retention-days: 14
          path: |
            pilot-desktop/out/host-report/**
            pilot-mobile/bridge/build/reports/**
            pilot-mobile/transport/build/reports/**
