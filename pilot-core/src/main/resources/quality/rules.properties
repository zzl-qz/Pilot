# 由 config/quality/rules.json 生成，请勿手改。
# 运行时审计（pilot-core）从中读取阈值，避免和提交门禁出现两套口径。
long-method.limit=80
too-many-parameters.limit=7
deep-if-nesting.limit=5
deep-loop-nesting.limit=3
deep-try-nesting.limit=3
high-cyclomatic-complexity.limit=20
too-many-statements.limit=60
deep-nesting.limit=5
duplicate-block.limit=7
else-if-chain.limit=6
repeated-literal.limit=3
