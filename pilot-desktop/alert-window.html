<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Pilot 提醒</title>
<style>
  :root {
    --bg: #1b1d22;
    --panel: #23262d;
    --border: rgba(255, 255, 255, 0.14);
    --ink: #f3f5f8;
    --muted: #a4acb9;
    --accent: #4fa3ea;
    --accent-soft: rgba(79, 163, 234, 0.16);
    --warn: #f2b544;
    --warn-soft: rgba(242, 181, 68, 0.16);
    --danger: #ff6f6f;
    --danger-soft: rgba(255, 111, 111, 0.16);
    --ok: #3ecf8e;
    --ok-soft: rgba(62, 207, 142, 0.16);
  }
  html[data-theme="light"] {
    --bg: #ffffff;
    --panel: #f5f7fa;
    --border: rgba(15, 23, 42, 0.12);
    --ink: #111827;
    --muted: #4b5563;
    --accent: #0969da;
    --accent-soft: rgba(9, 105, 218, 0.12);
    --warn: #b45309;
    --warn-soft: rgba(217, 119, 6, 0.14);
    --danger: #dc2626;
    --danger-soft: rgba(220, 38, 38, 0.12);
    --ok: #15803d;
    --ok-soft: rgba(21, 128, 61, 0.12);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    user-select: none;
  }
  .card {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    background: var(--bg);
  }
  .head {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    background: var(--accent-soft);
    color: var(--accent);
    flex: none;
  }
  .badge.is-approval { background: var(--warn-soft); color: var(--warn); }
  .badge.is-error { background: var(--danger-soft); color: var(--danger); }
  .badge.is-done { background: var(--ok-soft); color: var(--ok); }
  .risk {
    padding: 2px 7px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    background: var(--danger-soft);
    color: var(--danger);
    flex: none;
  }
  .session {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted);
    font-size: 11.5px;
  }
  .pager {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--muted);
    font-size: 11px;
    flex: none;
  }
  .icon-btn {
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    border-radius: 6px;
    padding: 2px 6px;
    cursor: pointer;
    font: inherit;
    line-height: 1.2;
  }
  .icon-btn:hover { background: var(--panel); color: var(--ink); border-color: var(--border); }
  .title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .title {
    margin: 0;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
    overflow-wrap: anywhere;
  }
  .countdown {
    flex: none;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .countdown.is-urgent { color: var(--danger); font-weight: 600; }
  .body {
    margin: 0;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    color: var(--ink);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.45;
    max-height: 126px;
    overflow: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    user-select: text;
  }
  .body.is-prose {
    font-family: inherit;
    font-size: 12.5px;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 5px;
    max-height: 184px;
    overflow: auto;
  }
  .option-btn {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    color: var(--ink);
    text-align: left;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .option-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
  .option-num {
    flex: none;
    width: 17px;
    height: 17px;
    border-radius: 50%;
    background: var(--bg);
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10.5px;
  }
  .custom-form {
    display: flex;
    gap: 6px;
  }
  .custom-input {
    flex: 1;
    min-width: 0;
    padding: 6px 9px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    font-size: 12px;
    user-select: text;
  }
  .custom-input:focus { outline: none; border-color: var(--accent); }
  .actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    flex-wrap: wrap;
  }
  .actions .spacer { margin-right: auto; }
  .btn {
    padding: 6px 11px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.is-primary { background: var(--accent); border-color: var(--accent); color: #ffffff; font-weight: 600; }
  .btn.is-danger { background: var(--danger); border-color: var(--danger); color: #ffffff; font-weight: 600; }
</style>
</head>
<body>
<main id="root" class="card"></main>
<script>
const root = document.getElementById('root');
let currentState = { items: [] };
let activeIndex = 0;
let hovered = false;
let lastKey = '';
let draftText = '';
let rejectOpen = false;
let rejectDraft = '';

function notifySize() {
  if (!window.pilotAlert || typeof window.pilotAlert.resize !== 'function') return;
  const rect = root.getBoundingClientRect();
  window.pilotAlert.resize(Math.ceil(rect.height));
}

const observer = typeof ResizeObserver === 'function' ? new ResizeObserver(notifySize) : null;
observer?.observe(root);

root.addEventListener('mouseenter', () => { hovered = true; });
root.addEventListener('mouseleave', () => { hovered = false; });

function countdownLabel(expiresAt) {
  if (!expiresAt) return '';
  const remain = Math.max(0, Math.floor((expiresAt - Date.now()) / 1000));
  const min = Math.floor(remain / 60);
  const sec = remain % 60;
  return { text: remain > 0 ? '剩余 ' + min + ':' + String(sec).padStart(2, '0') : '即将超时', urgent: remain <= 30 };
}

function makeButton(label, cls, onClick) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = cls;
  btn.textContent = label;
  btn.addEventListener('click', onClick);
  return btn;
}

function dispatch(item, action, extra) {
  window.pilotAlert.act(Object.assign({
    action,
    id: item.id,
    sessionId: item.sessionId,
    callId: item.callId
  }, extra));
}

function makeTextForm({ placeholder, value, onInput, submitLabel, submitClass, onSubmit }) {
  const form = document.createElement('form');
  form.className = 'custom-form';
  const input = document.createElement('input');
  input.className = 'custom-input';
  input.placeholder = placeholder;
  input.value = value;
  input.addEventListener('input', () => onInput(input.value));
  input.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && (event.isComposing || event.keyCode === 229)) {
      event.preventDefault();
    }
  });
  const submitBtn = document.createElement('button');
  submitBtn.type = 'submit';
  submitBtn.className = submitClass;
  submitBtn.textContent = submitLabel;
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    onSubmit(input.value.trim());
  });
  form.append(input, submitBtn);
  return form;
}

function render() {
  const items = Array.isArray(currentState.items) ? currentState.items : [];
  if (!items.length) {
    root.textContent = '';
    return;
  }
  if (activeIndex >= items.length) activeIndex = 0;
  const item = items[activeIndex];
  const itemKey = item.id + ':' + item.updatedAt;
  if (itemKey !== lastKey) {
    lastKey = itemKey;
    draftText = '';
    rejectOpen = false;
    rejectDraft = '';
  }
  document.documentElement.dataset.theme = item.theme === 'light' ? 'light' : 'dark';
  root.textContent = '';

  const head = document.createElement('div');
  head.className = 'head';

  const badge = document.createElement('span');
  badge.className = 'badge is-' + item.kind;
  badge.textContent = item.categoryLabel || (item.kind === 'approval' ? '等待批准' : item.kind === 'question' ? '等待选择' : item.kind === 'error' ? '运行异常' : '任务完成');
  head.appendChild(badge);

  if (item.highRisk) {
    const risk = document.createElement('span');
    risk.className = 'risk';
    risk.textContent = '高风险';
    head.appendChild(risk);
  }

  const session = document.createElement('span');
  session.className = 'session';
  session.textContent = item.sessionTitle || '';
  session.title = item.sessionTitle || '';
  head.appendChild(session);

  if (items.length > 1) {
    const pager = document.createElement('span');
    pager.className = 'pager';
    const prev = makeButton('‹', 'icon-btn', () => {
      activeIndex = (activeIndex - 1 + items.length) % items.length;
      render();
    });
    const count = document.createElement('span');
    count.textContent = (activeIndex + 1) + '/' + items.length;
    const next = makeButton('›', 'icon-btn', () => {
      activeIndex = (activeIndex + 1) % items.length;
      render();
    });
    pager.append(prev, count, next);
    head.appendChild(pager);
  }

  const closeBtn = makeButton('×', 'icon-btn', () => dispatch(item, 'dismiss'));
  closeBtn.setAttribute('aria-label', '关闭此提醒');
  head.appendChild(closeBtn);
  root.appendChild(head);

  const titleRow = document.createElement('div');
  titleRow.className = 'title-row';
  const title = document.createElement('h2');
  title.className = 'title';
  title.textContent = item.title;
  titleRow.appendChild(title);

  const cd = countdownLabel(item.expiresAt);
  if (cd) {
    const cdEl = document.createElement('span');
    cdEl.className = 'countdown' + (cd.urgent ? ' is-urgent' : '');
    cdEl.textContent = cd.text;
    cdEl.dataset.expiresAt = String(item.expiresAt);
    titleRow.appendChild(cdEl);
  }
  root.appendChild(titleRow);

  if (item.body) {
    const body = document.createElement(item.kind === 'approval' ? 'pre' : 'p');
    body.className = 'body' + (item.kind === 'approval' ? '' : ' is-prose');
    body.textContent = item.body;
    root.appendChild(body);
  }

  if (item.kind === 'question') {
    const list = document.createElement('div');
    list.className = 'options';
    (item.options || []).forEach((opt, idx) => {
      const optBtn = document.createElement('button');
      optBtn.type = 'button';
      optBtn.className = 'option-btn';
      const num = document.createElement('span');
      num.className = 'option-num';
      num.textContent = String(idx + 1);
      const txt = document.createElement('span');
      txt.textContent = opt;
      optBtn.append(num, txt);
      optBtn.addEventListener('click', () => dispatch(item, 'answer', { choice: opt }));
      list.appendChild(optBtn);
    });
    root.appendChild(list);

    root.appendChild(makeTextForm({
      placeholder: '都不是，自己填写后回车',
      value: draftText,
      onInput: (value) => { draftText = value; },
      submitLabel: '提交',
      submitClass: 'btn is-primary',
      onSubmit: (value) => { if (value) dispatch(item, 'answer', { choice: value }); }
    }));
  }

  const actions = document.createElement('div');
  actions.className = 'actions';
  if (item.kind === 'approval') {
    if (rejectOpen) {
      root.appendChild(makeTextForm({
        placeholder: '说明拒绝原因或修改建议…',
        value: rejectDraft,
        onInput: (value) => { rejectDraft = value; },
        submitLabel: '提交拒绝',
        submitClass: 'btn is-danger',
        onSubmit: (reason) => dispatch(item, 'reject', reason ? { reason } : undefined)
      }));
    }
    const focusBtn = makeButton('前往对话', 'btn spacer', () => dispatch(item, 'focus-session'));
    const toggleReasonBtn = makeButton(rejectOpen ? '收起' : '附原因', 'btn', () => {
      rejectOpen = !rejectOpen;
      render();
    });
    const rejectBtn = makeButton('拒绝', 'btn', () => dispatch(item, 'reject'));
    const approveBtn = makeButton('批准', 'btn ' + (item.highRisk ? 'is-danger' : 'is-primary'), () => dispatch(item, 'approve'));
    actions.append(focusBtn, toggleReasonBtn, rejectBtn, approveBtn);
  } else if (item.kind === 'question') {
    actions.append(makeButton('前往对话', 'btn', () => dispatch(item, 'focus-session')));
  } else {
    const focusBtn = makeButton('查看结果', 'btn is-primary', () => dispatch(item, 'focus-session'));
    const okBtn = makeButton('知道了', 'btn', () => dispatch(item, 'dismiss'));
    actions.append(okBtn, focusBtn);
  }
  root.appendChild(actions);
  requestAnimationFrame(notifySize);
}

setInterval(() => {
  const el = root.querySelector('.countdown');
  if (!el) return;
  const cd = countdownLabel(Number(el.dataset.expiresAt || 0));
  if (cd) {
    el.textContent = cd.text;
    el.className = 'countdown' + (cd.urgent ? ' is-urgent' : '');
  }
}, 1000);

window.pilotAlert?.onState((state) => {
  currentState = state || { items: [] };
  if (!hovered && activeIndex !== 0) activeIndex = 0;
  render();
});
</script>
</body>
</html>
