spring.application.name=Pilot
# 本机密钥与真实模型开关放在 application-local.properties（已被 .gitignore 忽略）
spring.profiles.active=${PILOT_PROFILE:local}

# 模型配置：可用环境变量覆盖。endpoint 可填完整地址，也可只填服务根地址（自动补 /v1/chat/completions）
pilot.model.endpoint=${PILOT_MODEL_ENDPOINT:https://api.openai.com/v1/chat/completions}
pilot.model.model=${PILOT_MODEL_MODEL:gpt-4o-mini}
# 不要在会被提交的文件里写 Key；用 application-local.properties 或环境变量 PILOT_MODEL_API_KEY
pilot.model.api-key=${PILOT_MODEL_API_KEY:}
# 单次模型请求超时（秒）；中转站可能更早返回 504
pilot.model.timeout-seconds=90

# Sprint 2: mock = 离线 Mock 剧本；real = 真实模型 + 只读工具
pilot.agent.mode=${PILOT_AGENT_MODE:mock}
# 工具可访问的根目录，默认进程工作目录；建议显式指定项目根目录
pilot.agent.workspace=${PILOT_WORKSPACE:${user.dir}}
pilot.agent.max-steps=8
pilot.agent.repeated-tool-call-limit=3

# mock 模式的推送节奏
pilot.mock.enabled=true
pilot.mock.step-delay-ms=250
