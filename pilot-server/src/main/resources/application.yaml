# Pilot 本机配置。这个文件是 UTF-8 的 YAML。
# 以前的 properties 在 IDE 里常被当成 ISO-8859-1，中文注释会显示成乱码。

server:
  # 本机页面和接口都走这个端口
  port: 9999
  error:
    # 4xx 把校验原因带回响应体，界面能直接看到「端点必须是 http/https」这类说明
    include-message: always
    # 堆栈只写日志，不回给前端（本机接口也可能通过远程访问开关暴露出去）
    include-stacktrace: never

spring:
  servlet:
    multipart:
      # 语音上传和前端预检从实际 multipart 限额派生，修改文件上限时也要给请求封装留空间。
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: Pilot
  # 本机密钥放在同目录的 application-local.yaml（已被 git 忽略），或用环境变量 PILOT_PROFILE 换一套
  profiles:
    active: ${PILOT_PROFILE:local}
  web:
    resources:
      cache:
        cachecontrol:
          # 本地改前端后，浏览器每次重新校验，避免刷新仍看到旧 JS/CSS
          no-cache: true

pilot:
  multi:
    budget:
      # 单次派发墙钟上限（秒）。到期后停止准入，并尽力中断在途子任务；仍是本地软限制。
      max-dispatch-seconds: ${PILOT_MULTI_BUDGET_MAX_DISPATCH_SECONDS:1800}
      # 输入 + 输出 token 总上限；0 表示不限。缺失 usage 会估算，在途输出可能导致超额。
      max-total-tokens: ${PILOT_MULTI_BUDGET_MAX_TOTAL_TOKENS:0}
  mobile:
    # auto 使用内置公共连接服务，尽力直连、必要时中继；direct 完全关闭公共服务。
    # 二维码始终本地生成，跨网服务在后台准备，不阻塞出码。
    mode: ${PILOT_MOBILE_MODE:auto}
    # 留空使用 auto 内置服务；填写后改用指定 iroh 中继，例如 https://relay.example.com:443。
    # 这里必须是可供双方访问的 iroh 中继服务，不是 HTTP 代理或普通路由器端口。
    relay: ${PILOT_MOBILE_RELAY:}
  desktop:
    # 服务起来后打开桌面窗口。浏览器访问同一端口仍然可用。测试里关掉。
    launch: ${PILOT_DESKTOP_LAUNCH:true}
    # 桌面壳（pilot-desktop 的 Electron）没装时后台自动 npm install（官方源失败换 npmmirror），
    # 装好自动开窗。false = 只提示手动安装命令。
    provision: ${PILOT_DESKTOP_PROVISION:true}
  data:
    # 会话库、快照、trace、附件默认放在项目下的 .pilot
    # 要换位置：环境变量 PILOT_DATA_DIR，或启动参数 -Dpilot.data.dir=...
    dir: ${PILOT_DATA_DIR:${user.dir}/.pilot}
  # 附件请求边界：单条消息的文件数、单文件大小与解码后总量。
  # 移动端能力值由此派生，默认最多 16 个文件、单文件 2MB、总量 6MB。
  # 限额可通过 pilot.attachments.* 或 PILOT_ATTACHMENTS_* 配置，默认值由 AttachmentLimits 提供。
  attachments:
    dir: ${PILOT_ATTACHMENTS_DIR:}                    # 留空用数据目录下的 attachments
  # 浏览器（browser 工具 + 右侧「浏览器」面板）：内置 Chromium，默认无头。
  # pilot.browser.* 可按部署覆盖。默认值由 BrowserHome、BrowserRuntime 和 BrowserControlService 提供。
  # PILOT_VOICE_MAX_RECORDING_SECONDS 可覆盖 120 秒的录音时长，PILOT_VOICE_MODEL 可设置默认转写模型。
  model:
    # endpoint 可以写服务根地址，也可以写完整的 /v1/chat/completions
    endpoint: ${PILOT_MODEL_ENDPOINT:https://api.openai.com/v1/chat/completions}
    model: ${PILOT_MODEL_MODEL:gpt-4o-mini}
    # 不要把密钥写进会提交的文件。用 application-local.yaml，或环境变量 PILOT_MODEL_API_KEY
    api-key: ${PILOT_MODEL_API_KEY:}
    # 单次模型请求默认总超时（秒），包含响应头及完整响应体；模型设置页可按端点与模型覆盖。
    # PILOT_MODEL_TIMEOUT_SECONDS 默认 900；PILOT_MODEL_IDLE_TIMEOUT_SECONDS 默认 600，0 表示跟随总时限。
    # PILOT_MODEL_CONNECT_TIMEOUT_SECONDS 默认 10，供聊天和模型列表共用。
    # 给 system 提示词打 cache_control 显式缓存标记：只对支持该字段的端点（Anthropic 兼容网关）开启。
    # OpenAI 官方端点按前缀自动缓存，保持 false 即可，避免第三方端点拒绝未知字段。
    prompt-caching: ${PILOT_MODEL_PROMPT_CACHING:false}
  agent:
    goal-mode-enabled: ${PILOT_AGENT_GOAL_MODE_ENABLED:true}
    # 工具能碰到的根目录，默认是进程工作目录。建议显式指到项目根
    workspace: ${PILOT_WORKSPACE:${user.dir}}
    # 单轮步数上限，只当事故熔断。触顶后界面可以继续接着跑
    # 默认值由 AgentProperties 提供，可用 PILOT_AGENT_MAX_STEPS 覆盖。
    # 执行预算只是高位事故熔断，不作为日常收尾条件，也不在半额度强制改变策略。
    # 触发后保留进度、证据、待执行动作和预期观察；继续才开启新的预算段。
    # 留空使用 AgentProperties 的默认值。
    direct-max-requests: ${PILOT_AGENT_DIRECT_MAX_REQUESTS:}
    direct-max-input-tokens: ${PILOT_AGENT_DIRECT_MAX_INPUT_TOKENS:}
    direct-max-output-tokens: ${PILOT_AGENT_DIRECT_MAX_OUTPUT_TOKENS:}
    direct-max-active-millis: ${PILOT_AGENT_DIRECT_MAX_ACTIVE_MILLIS:}
    # 兼容旧配置的高位调查诊断值；运行时不据此拒绝合法的读取和搜索。
    direct-max-investigation-tools: ${PILOT_AGENT_DIRECT_MAX_INVESTIGATION_TOOLS:}
    # Goal 长任务的高位事故熔断。
    goal-max-input-tokens: ${PILOT_AGENT_GOAL_MAX_INPUT_TOKENS:}
    goal-max-output-tokens: ${PILOT_AGENT_GOAL_MAX_OUTPUT_TOKENS:}
    goal-max-active-millis: ${PILOT_AGENT_GOAL_MAX_ACTIVE_MILLIS:}
    # 计划只作为给模型和用户的进度提示，不因为没写完就拦住收尾
    max-plan-continues: ${PILOT_AGENT_MAX_PLAN_CONTINUES:}
    # 上下文预算（字符估算）。太小会频繁压缩、丢细节；128k 窗口的模型可以开到 300000 左右
    context-max-chars: ${PILOT_AGENT_CONTEXT_MAX_CHARS:}
    # 连续相同工具调用只注入提醒，不再中断运行
    repeat-remind-at: ${PILOT_AGENT_REPEAT_REMIND_AT:}
    # READ_ONLY 只读；ASK 写入与命令逐次批准；
    # AUTO_EDIT 写入直接生效、命令仍批准；AUTO 全部放行（Pilot 默认，工作区边界仍生效）
    permission-mode: ${PILOT_PERMISSION_MODE:AUTO}
    # PILOT_AGENT_APPROVAL_TIMEOUT_SECONDS 可覆盖审批等待时限，默认 300 秒。
    # 通用收尾检查门默认开启；Direct 按实际证据报告检查通过、失败、陈旧或未验证。
    # 执行结束不代表已核验；Goal 独立核验不受此开关影响。
    # 留空时兼容 JVM 参数 -Dpilot.completion.checks。
    completion-checks: ${PILOT_AGENT_COMPLETION_CHECKS:}
    # 同时能跑的任务数。一个任务卡住时，不要把后面的任务全堵死
    # PILOT_AGENT_RUN_THREADS 可覆盖默认的 4 个运行线程。
  web-search:
    # true：启动时在本机拉起 SearXNG。false：不拉起。不需要搜索密钥。
    local: ${PILOT_WEB_SEARCH_LOCAL:true}
    # 留空使用内置搜索地址。回环 HTTP 根地址未写端口时，本机模式沿用内置端口。
    endpoint: ${PILOT_WEB_SEARCH_ENDPOINT:}
    # 请求总时限包含响应体，默认 20 秒。可用 PILOT_WEB_SEARCH_REQUEST_TIMEOUT_SECONDS 覆盖。
    request-timeout-seconds: ${PILOT_WEB_SEARCH_REQUEST_TIMEOUT_SECONDS:}
    # 留空则自动找 Python 3.11+。打包时可以指到安装目录里的 python
    python: ${PILOT_WEB_SEARCH_PYTHON:}
    # 留空则用数据目录里的副本；已有源码目录时填这里，避免每次下载
    home: ${PILOT_WEB_SEARCH_HOME:}
  runtime:
    # true：缺 Python 3.12 / Node 22 时下载到 .pilot/runtime，run_command 优先用它们
    provision: ${PILOT_RUNTIME_PROVISION:true}
  # 技能：SKILL.md + 参考文件 + 可选脚本的纯文件技能包，激活即注入指引、动作仍走既有工具
  # 项目级 <workspace>/.pilot/skills（随仓库走）、用户级 <dataDir>/skills（本机个人库，PILOT_SKILLS_DIR 可改）
  skills:
    # false 时整条链退化：use_skill 不注册、目录段不注入、/api/skills 返回空
    enabled: true
  # 命令执行的隔离级别。local 只做应用层检查；container 会在容器里跑校验命令，
  # 需要本机有 Docker/Podman 和包含项目工具链的镜像。容器不可用时不会静默降级，
  # /api/maintenance/status 会显示降级原因。
  execution:
    isolation: ${PILOT_EXECUTION_ISOLATION:local}
    # 镜像和资源默认值由 ExecutionSettings / ExecutionLimits 提供。
    # 可用 PILOT_EXECUTION_IMAGE、PILOT_EXECUTION_MEMORY_MB、PILOT_EXECUTION_CPUS、PILOT_EXECUTION_PIDS_LIMIT 覆盖。
    runtime: ${PILOT_CONTAINER_RUNTIME:}
    # 网络关闭时依赖仅从本项目缓存读取；打开后整个校验流程均能联网，不是仅允许下载依赖。
    # 项目缓存位于 pilot.data.dir/build-cache，按工作区、实际镜像 ID 和依赖清单分区。
    network: ${PILOT_EXECUTION_NETWORK:false}
    # 主会话 run_command 的网络。文件系统沙箱默认开；域名级放行需要代理，所以这里默认允许出网。
    # 设为 false 时，macOS Seatbelt / Linux bubblewrap 会关掉命令的网络。
    command-network: ${PILOT_EXECUTION_COMMAND_NETWORK:true}
  # 远程访问边界。local 只允许本机回环；token 允许远程，但必须带访问令牌。
  # SSE 的 EventSource 不能加请求头，因此令牌也接受 ?token=，务必配合来源校验与限流使用。
  security:
    mode: ${PILOT_SECURITY_MODE:local}
    token: ${PILOT_SECURITY_TOKEN:}
    allowed-origins: ${PILOT_SECURITY_ALLOWED_ORIGINS:}
    # local 模式默认只接受 localhost/127/8/::1；自定义代理域名显式列出 Host（含端口）。
    allowed-hosts: ${PILOT_SECURITY_ALLOWED_HOSTS:}
    rate-limit-per-minute: ${PILOT_SECURITY_RATE_LIMIT:600}
    audit: ${PILOT_SECURITY_AUDIT:true}
  # 运行期数据保留：事件、快照、trace 默认只增不减。设成正数后每天清理一次早于 N 天的数据，
  # 0 表示关闭（保留全部）。会话本身不会被删。
  retention:
    days: ${PILOT_RETENTION_DAYS:0}
    # 备份与校验证据通常不需要长期保留，可以单独设置更短的期限
    backups-days: ${PILOT_RETENTION_BACKUPS_DAYS:0}
    validation-days: ${PILOT_RETENTION_VALIDATION_DAYS:0}
    # 仅清理已超过 N 天且没有所属会话的附件目录；在册会话的附件保留。
    attachments-days: ${PILOT_RETENTION_ATTACHMENTS_DAYS:0}
