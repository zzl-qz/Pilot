# Pilot 本机配置。这个文件是 UTF-8 的 YAML。
# 以前的 properties 在 IDE 里常被当成 ISO-8859-1，中文注释会显示成乱码。

server:
  # 本机页面和接口都走这个端口
  port: 9999
  error:
    # 4xx 把校验原因带回响应体，界面能直接看到「端点必须是 http/https」这类说明
    include-message: always

spring:
  application:
    name: Pilot
  # 本机密钥放在同目录的 application-local.yaml（已被 git 忽略），或用环境变量 PILOT_PROFILE 换一套
  profiles:
    active: ${PILOT_PROFILE:local}
  web:
    resources:
      cache:
        cachecontrol:
          # 本地改前端后，浏览器每次重新校验，避免刷新仍看到旧 JS/CSS
          no-cache: true
  devtools:
    livereload:
      # 浏览器自动刷新那条附加服务用不上，关掉以免多占一个端口
      enabled: false
    restart:
      # IDEA 会分批写入多模块的 class 文件。给编译留出完整落盘时间，避免只看到 server、
      # 尚未看到 core 时就提前重启，产生 SnapshotSink.class 等短暂缺失。
      poll-interval: 2s
      quiet-period: 1s

pilot:
  data:
    # 会话库、快照、trace、附件默认放在项目下的 .pilot
    # 要换位置：环境变量 PILOT_DATA_DIR，或启动参数 -Dpilot.data.dir=...
    dir: ${PILOT_DATA_DIR:${user.dir}/.pilot}
  model:
    # endpoint 可以写服务根地址，也可以写完整的 /v1/chat/completions
    endpoint: ${PILOT_MODEL_ENDPOINT:https://api.openai.com/v1/chat/completions}
    model: ${PILOT_MODEL_MODEL:gpt-4o-mini}
    # 不要把密钥写进会提交的文件。用 application-local.yaml，或环境变量 PILOT_MODEL_API_KEY
    api-key: ${PILOT_MODEL_API_KEY:}
    # 单次模型请求超时（秒）。中转站可能更早返回 504
    timeout-seconds: 90
  agent:
    goal-mode-enabled: ${PILOT_AGENT_GOAL_MODE_ENABLED:true}
    # 工具能碰到的根目录，默认是进程工作目录。建议显式指到项目根
    workspace: ${PILOT_WORKSPACE:${user.dir}}
    # 单轮步数上限，只当事故熔断。触顶后界面可以继续接着跑
    max-steps: ${PILOT_AGENT_MAX_STEPS:1000}
    # 执行预算只是高位事故熔断，不作为日常收尾条件，也不在半额度强制改变策略。
    # 触发后保留进度、证据、待执行动作和预期观察；继续才开启新的预算段。
    direct-max-requests: ${PILOT_AGENT_DIRECT_MAX_REQUESTS:1000}
    direct-max-input-tokens: ${PILOT_AGENT_DIRECT_MAX_INPUT_TOKENS:50000000}
    direct-max-output-tokens: ${PILOT_AGENT_DIRECT_MAX_OUTPUT_TOKENS:2000000}
    direct-max-active-millis: ${PILOT_AGENT_DIRECT_MAX_ACTIVE_MILLIS:28800000}
    # 兼容旧配置的高位调查诊断值；运行时不据此拒绝合法的读取和搜索。
    direct-max-investigation-tools: ${PILOT_AGENT_DIRECT_MAX_INVESTIGATION_TOOLS:512}
    # Goal 长任务的高位事故熔断。
    goal-max-input-tokens: ${PILOT_AGENT_GOAL_MAX_INPUT_TOKENS:50000000}
    goal-max-output-tokens: ${PILOT_AGENT_GOAL_MAX_OUTPUT_TOKENS:2000000}
    goal-max-active-millis: ${PILOT_AGENT_GOAL_MAX_ACTIVE_MILLIS:28800000}
    # 计划只作为给模型和用户的进度提示，不因为没写完就拦住收尾
    max-plan-continues: ${PILOT_AGENT_MAX_PLAN_CONTINUES:0}
    # 上下文预算（字符估算）。太小会频繁压缩、丢细节；128k 窗口的模型可以开到 300000 左右
    context-max-chars: ${PILOT_AGENT_CONTEXT_MAX_CHARS:400000}
    # 连续相同工具调用只注入提醒，不再中断运行
    repeat-remind-at: 3
    # READ_ONLY 只读（对应 Codex/OpenCode 的 plan 模式）；ASK 逐次批准；
    # AUTO_EDIT 写入直接生效、命令仍批准；AUTO 全部放行（默认，与 Codex/OpenCode 一致）
    permission-mode: ${PILOT_PERMISSION_MODE:AUTO}
    approval-timeout-seconds: 300
    # 收尾门默认关闭：模型说完成就完成，不再额外要求验证或自审（与 Codex/OpenCode 一致）
    completion-checks: ${PILOT_AGENT_COMPLETION_CHECKS:false}
    # 同时能跑的任务数。一个任务卡住时，不要把后面的任务全堵死
    run-threads: ${PILOT_AGENT_RUN_THREADS:4}
  web-search:
    # true：启动时在本机拉起 SearXNG。false：不拉起。不需要搜索密钥。
    local: ${PILOT_WEB_SEARCH_LOCAL:true}
    endpoint: ${PILOT_WEB_SEARCH_ENDPOINT:http://127.0.0.1:8888}
    # 留空则自动找 Python 3.11+。打包时可以指到安装目录里的 python
    python: ${PILOT_WEB_SEARCH_PYTHON:}
    # 留空则用数据目录里的副本；已有源码目录时填这里，避免每次下载
    home: ${PILOT_WEB_SEARCH_HOME:}
  runtime:
    # true：缺 Python 3.12 / Node 22 时下载到 .pilot/runtime，run_command 优先用它们
    provision: ${PILOT_RUNTIME_PROVISION:true}
  # 运行期数据保留：事件、快照、trace 默认只增不减。设成正数后每天清理一次早于 N 天的数据，
  # 0 表示关闭（保留全部）。会话本身不会被删。
  retention:
    days: ${PILOT_RETENTION_DAYS:0}
